name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    env:
      PYTHONPATH: backend
      DATABASE_URL: sqlite:///./ci-tests.db
      DATABASE_URL_ASYNC: sqlite+aiosqlite:///./ci-tests.db
      SECRET_KEY: ci-only-secret-key-not-for-production-64-byte-placeholder-value
      SMTP_HOST: localhost
      SMTP_PORT: "25"
      SMTP_USER: ci
      SMTP_PASSWORD: ci
      EMAIL_FROM: ci@example.com
      S3_ENDPOINT_URL: http://localhost:8333
      S3_PUBLIC_ENDPOINT_URL: http://localhost:8333
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m compileall -q backend/app backend/scripts scripts
      - name: Prepare official Ubuntu package mirror
        run: bash scripts/ci/prepare_ubuntu_apt.sh
      - name: Install MP4 validation tools
        timeout-minutes: 6
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m ruff check --select E4,E7,E9,F --ignore F401 backend/app backend/tests backend/alembic backend/scripts scripts
      - run: python -m pytest backend/tests -q --cov=backend/app --cov-branch --cov-report=term-missing --cov-report=xml:.local-test-artifacts/coverage/backend.xml
        env:
          COVERAGE_FILE: .local-test-artifacts/coverage/.coverage
      - name: Enforce separate backend line and branch floors
        run: python backend/scripts/check_coverage.py .local-test-artifacts/coverage/backend.xml
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: .local-test-artifacts/coverage/backend.xml
          include-hidden-files: true
          if-no-files-found: warn

  backend-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install isolated runtime dependency audit environment
        run: |
          python -m venv .local-test-artifacts/audit-env
          .local-test-artifacts/audit-env/bin/python -m pip install --upgrade pip==26.2.2 setuptools==84.2.1
          .local-test-artifacts/audit-env/bin/python -m pip install -r backend/requirements-audit.txt
      - name: Audit installed Python dependencies without ignored advisories
        run: |
          mkdir -p .local-test-artifacts/audit
          .local-test-artifacts/audit-env/bin/python -m pip_audit --strict --progress-spinner off --format json --output .local-test-artifacts/audit/backend.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: backend-dependency-audit
          path: .local-test-artifacts/audit/backend.json
          include-hidden-files: true
          if-no-files-found: warn

  postgres-migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: rslhelper_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d rslhelper_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      MIGRATION_TEST_BACKEND: postgresql
      POSTGRES_TEST_URL: postgresql://ci:ci-postgres-password@localhost:5432/rslhelper_ci
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: PostgreSQL migration, account and learning regression checks
        run: python -m pytest backend/tests/test_migrations.py backend/tests/test_accounts_postgresql.py backend/tests/test_mail_postgresql.py backend/tests/test_learning_postgresql.py backend/tests/test_rate_limits_postgresql.py -q

  media-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify real PostgreSQL and private SeaweedFS media operations
        run: docker compose -p rslhelper-media-ci -f docker-compose.test.yml --profile test run --build --rm backend-media-tests
      - name: Clean isolated test resources
        if: always()
        run: docker compose -p rslhelper-media-ci -f docker-compose.test.yml --profile test down --volumes

  mail-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify SMTP delivery and account recovery on isolated PostgreSQL
        run: docker compose -p rslhelper-mail-ci -f docker-compose.test.yml --profile test run --build --rm backend-mail-tests
      - name: Clean isolated mail test resources
        if: always()
        run: docker compose -p rslhelper-mail-ci -f docker-compose.test.yml --profile test down --volumes

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run typecheck:tools
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: frontend-coverage
          path: .local-test-artifacts/coverage/frontend
          include-hidden-files: true
          if-no-files-found: warn

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local-test-artifacts/browsers
      PLAYWRIGHT_CONSOLE_USER: ciadmin
      PLAYWRIGHT_CONSOLE_PASSWORD: ci-console-test-password
      PLAYWRIGHT_NO_COPY_PROMPT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare official Ubuntu package mirror
        run: bash scripts/ci/prepare_ubuntu_apt.sh
      - name: Install browser dependencies
        timeout-minutes: 8
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check failure artifact privacy
        working-directory: frontend
        run: node scripts/check-e2e-privacy.mjs
      - name: Start isolated browser stack
        run: docker compose -p rslhelper-browser-ci -f docker-compose.test.yml --profile e2e up -d --build --wait
      - name: Prepare a synthetic H264 clip
        run: |
          mkdir -p .local-test-artifacts
          docker compose -p rslhelper-browser-ci -f docker-compose.test.yml --profile e2e exec -T e2e-backend ffmpeg -v error -y -f lavfi -i color=c=blue:s=160x90:d=1.2 -c:v libx264 -pix_fmt yuv420p /tmp/browser-fixture.mp4
          docker compose -p rslhelper-browser-ci -f docker-compose.test.yml --profile e2e cp e2e-backend:/tmp/browser-fixture.mp4 .local-test-artifacts/browser-fixture.mp4
      - name: Browser journeys with scoped fixture cleanup
        shell: pwsh
        run: |
          ./scripts/run_e2e.ps1 -VideoPath ./.local-test-artifacts/browser-fixture.mp4 -ComposeProject rslhelper-browser-ci -ComposeFile docker-compose.test.yml -Profile e2e -BackendService e2e-backend -MailpitUrl http://localhost:18025
      - name: Remove isolated resources
        if: always()
        run: docker compose -p rslhelper-browser-ci -f docker-compose.test.yml --profile e2e down --volumes
      - name: Publish noncredential test summary
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-e2e-summary
          path: .local-test-artifacts/browser-e2e-summary.json
          include-hidden-files: true
          if-no-files-found: warn

  api-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python backend/scripts/export_openapi.py .local-test-artifacts/openapi.json
      - run: npm ci
        working-directory: frontend
      - run: npm run api:check && npm run typecheck
        working-directory: frontend
