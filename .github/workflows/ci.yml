name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    env:
      PYTHONPATH: backend
      DATABASE_URL: sqlite:///./ci-tests.db
      DATABASE_URL_ASYNC: sqlite+aiosqlite:///./ci-tests.db
      SECRET_KEY: ci-only-secret-key
      SMTP_HOST: localhost
      SMTP_PORT: "25"
      SMTP_USER: ci
      SMTP_PASSWORD: ci
      EMAIL_FROM: ci@example.com
      S3_ENDPOINT_URL: http://localhost:8333
      S3_PUBLIC_ENDPOINT_URL: http://localhost:8333
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m compileall -q backend/app backend/scripts scripts
      - run: python -m ruff check --select E4,E7,E9,F --ignore F401 backend/app backend/tests backend/alembic backend/scripts scripts
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
