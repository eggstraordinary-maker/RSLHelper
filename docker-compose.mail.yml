# Explicit local-development overlay. Messages stay in Mailpit, not real inboxes.
# docker compose -f docker-compose.yml -f docker-compose.mail.yml up -d --build --wait
services:
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:8025:8025"
    networks: [app-network]
  backend:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURITY: plain
      SMTP_AUTH: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_TIMEOUT_SECONDS: "10"
      EMAIL_FROM: rslhelper@example.test
    depends_on:
      mailpit:
        condition: service_started
