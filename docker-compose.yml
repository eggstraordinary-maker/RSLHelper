services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - ./postgres/.env
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command:
      - mini
      - -dir=/data
      - -ip=seaweedfs
      - -bucket=videos
      - -master.telemetry=false
      - -admin.ui=false
      - -webdav=false
    ports:
      - "127.0.0.1:8333:8333"
    env_file:
      - ./seaweedfs/.env
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - app-network

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
      - ./seaweedfs/.env
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT_URL: http://localhost:8333
      S3_BUCKET: videos
      S3_REGION: us-east-1
      FRONTEND_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: >
      sh -c "alembic -c alembic.ini upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:
  seaweedfs_data:

networks:
  app-network:
    driver: bridge
